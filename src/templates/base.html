<!DOCTYPE html>
<html class="scroll-smooth h-full" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{ page_title | default("ATHARVA SHARMA — Modeling Portfolio & Editorial Book") }}</title>
  
  <!-- Primary SEO Meta Tags -->
  <meta name="description" content="{{ meta_description | default('Official portfolio of Atharva Sharma, Indian male editorial and runway fashion model based in Udaipur, India. 6\'1\" (186cm), high luxury couture, runway poise, and commercial campaign bookings.') }}">
  <meta name="keywords" content="{{ meta_keywords | default('Atharva Sharma, male model India, Indian runway model, fashion model Udaipur, high fashion editorial, menswear model, 6\'1 model') }}">
  <meta name="author" content="Atharva Sharma">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <meta name="theme-color" content="#FBF9F6">
  <link rel="canonical" href="{{ canonical_url | default('https://rj-rishi91.github.io/Atharva-website/index.html') }}">

  <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
  <meta property="og:site_name" content="ATHARVA SHARMA // Modeling Portfolio">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ meta_description }}">
  <meta property="og:url" content="{{ canonical_url }}">
  <meta property="og:type" content="{{ page_type | default('website') }}">
  <meta property="og:locale" content="en_US">
  <meta property="og:image" content="{{ base_url }}/{{ og_image | default('assets/images/atharva-studio-bw-stool.png') }}">
  <meta property="og:image:alt" content="{{ page_title }}">

  <!-- Twitter / X Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page_title }}">
  <meta name="twitter:description" content="{{ meta_description }}">
  <meta name="twitter:image" content="{{ base_url }}/{{ og_image | default('assets/images/atharva-studio-bw-stool.png') }}">
  <meta name="twitter:creator" content="@atharvasharma.co.in">

  <!-- Local / Regional SEO -->
  <meta name="geo.region" content="IN-RJ">
  <meta name="geo.placename" content="Udaipur">
  <meta name="geo.position" content="24.5854;73.7125">
  <meta name="ICBM" content="24.5854, 73.7125">

  <!-- JSON-LD Structured Data Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Person",
        "@id": "{{ base_url }}/#atharva-sharma",
        "name": "Atharva Sharma",
        "alternateName": ["Atharva", "Model Atharva Sharma"],
        "url": "{{ base_url }}/index.html",
        "image": "{{ base_url }}/assets/images/atharva-studio-bw-stool.png",
        "jobTitle": ["Fashion Model", "Editorial Model", "Runway Model"],
        "gender": "Male",
        "height": {
          "@type": "QuantitativeValue",
          "value": 186,
          "unitCode": "CMT"
        },
        "description": "Atharva Sharma is an Indian male editorial and runway fashion model based in Udaipur, India. Height 6'1\" (186cm), Chest 38\", Waist 30\", Hazel eyes, Dark Brown hair.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Udaipur",
          "addressRegion": "Rajasthan",
          "addressCountry": "IN"
        },
        "email": "atharva@atharvasharma.co.in",
        "telephone": "+918209225998",
        "sameAs": [
          "https://www.instagram.com/atharvasharma.co.in",
          "https://github.com/RJ-Rishi91/Atharva-website"
        ]
      },
      {
        "@type": "WebSite",
        "@id": "{{ base_url }}/#website",
        "url": "{{ base_url }}/",
        "name": "ATHARVA SHARMA — Official Modeling Portfolio",
        "description": "Official editorial book, model composite card, measurements, and dispatches for Indian male runway model Atharva Sharma.",
        "publisher": {
          "@id": "{{ base_url }}/#atharva-sharma"
        }
      }{% if page_type == 'article' %},
      {
        "@type": "BlogPosting",
        "@id": "{{ canonical_url }}#article",
        "isPartOf": {
          "@id": "{{ base_url }}/journal.html"
        },
        "headline": "{{ page_title }}",
        "description": "{{ meta_description }}",
        "image": "{{ base_url }}/{{ og_image }}",
        "datePublished": "{{ date_published | default('2025-01-01') }}",
        "author": {
          "@id": "{{ base_url }}/#atharva-sharma"
        },
        "publisher": {
          "@id": "{{ base_url }}/#atharva-sharma"
        },
        "articleSection": "{{ category | default('Editorial') }}"
      }{% endif %}
    ]
  }
  </script>

  <!-- Preconnect and Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS with CDN -->

            'surface-container': '#EFECE6',
            'surface-container-low': '#F5F3F0',
            'surface-container-high': '#EAE8E5',
            'surface-container-highest': '#E4E2DF',
            'surface-container-lowest': '#FFFFFF',
            'surface-variant': '#E4E2DF',
            'surface-dim': '#DBDAD7',
            'surface-bright': '#FBF9F6',
            'primary': '#B20011',
            'primary-container': '#D72626',
            'primary-fixed': '#FFDAD6',
            'pure-black': '#0D0D0D',
            'pure-white': '#FFFFFF',

            'secondary-fixed': '#E5E2E1',
            'secondary-fixed-dim': '#C9C6C5',
            'secondary-container': '#E5E2E1',

            'on-primary-container': '#FFF1EF',
            'on-secondary': '#FFFFFF',
            'on-background': '#1B1C1A'

  </script>

  <style>
    /* Subtle noise grain simulation per DESIGN-TOKENS.md */
    .bg-grain {
      background-image: radial-gradient(rgba(13, 13, 13, 0.075) 1px, transparent 0);
      background-size: 3px 3px;
    }

    /* Edge-to-edge typography clamp per DESIGN-TOKENS.md */
    .hero-type-bleed {
      font-size: clamp(3.8rem, 12vw, 12.5rem);
      line-height: 0.85;
      letter-spacing: -0.025em;
    }

    /* Grayscale to vibrant color hover effect per DESIGN-TOKENS.md */
    .curated-photo {
      filter: grayscale(100%) contrast(108%);
      transition: filter 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .group:hover .curated-photo,
    .group.is-active .curated-photo {
      filter: grayscale(0%) contrast(102%);
      transform: scale(1.025);
    }

    /* Continuous ticker animation per DESIGN-TOKENS.md */
    @keyframes tickerScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .animate-ticker {
      display: inline-flex;
      white-space: nowrap;
      animation: tickerScroll 28s linear infinite;
    }
    .animate-ticker:hover {
      animation-play-state: paused;
    }

    /* Hero Stagger Animations per DESIGN-TOKENS.md */
    @keyframes heroFadeUp {
      0% { opacity: 0; transform: translateY(24px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes heroScaleIn {
      0% { opacity: 0; transform: scale(1.03); }
      100% { opacity: 1; transform: scale(1); }
    }

    .anim-fade-up {
      animation: heroFadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .anim-hero-frame {
      animation: heroScaleIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
      opacity: 0;
    }

    /* Accessibility: prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      .animate-ticker { animation: none !important; }
      .anim-fade-up, .anim-hero-frame { animation: none !important; opacity: 1 !important; }
      .curated-photo { transition: none !important; }
    }

    .nav-link {
      transition: color 0.2s ease;
    }
    .nav-link:hover {
      color: #D72626;
    }
    .nav-link.active {
      color: #D72626;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 6px;
      text-decoration-thickness: 2px;
    }
  </style>
</head>
<body class="bg-canvas-warm text-editorial-ink font-sans antialiased selection:bg-editorial-red selection:text-white relative overflow-x-hidden min-h-full flex flex-col justify-between">
  
  {% include 'header.html' %}

  <main class="w-full flex-grow">
    {% block content %}{% endblock %}
  </main>

  {% include 'footer.html' %}

  <script>
    // Mobile navigation toggle with icon swap, aria-expanded, and click-outside
    const navToggle = document.getElementById('mobile-nav-toggle');
    const navDrawer = document.getElementById('mobile-nav-drawer');
    const menuIcon = document.getElementById('menu-icon');
    
    if (navToggle && navDrawer) {
      navToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        const isHidden = navDrawer.classList.toggle('hidden');
        const isExpanded = !isHidden;
        navToggle.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');
        if (menuIcon) {
          menuIcon.textContent = isExpanded ? 'close' : 'menu';
        }
      });

      // Close drawer on click outside
      document.addEventListener('click', (e) => {
        if (!navDrawer.classList.contains('hidden') && !navDrawer.contains(e.target) && !navToggle.contains(e.target)) {
          navDrawer.classList.add('hidden');
          navToggle.setAttribute('aria-expanded', 'false');
          if (menuIcon) menuIcon.textContent = 'menu';
        }
      });

      // Close drawer on Escape key
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !navDrawer.classList.contains('hidden')) {
          navDrawer.classList.add('hidden');
          navToggle.setAttribute('aria-expanded', 'false');
          if (menuIcon) menuIcon.textContent = 'menu';
        }
      });
    }

    // Mobile tap interaction for photos (grayscale to color toggle)
    document.querySelectorAll('.group').forEach(item => {
      item.addEventListener('click', () => {
        item.classList.toggle('is-active');
      });
    });
  </script>
</body>
</html>
