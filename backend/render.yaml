services:
  - type: web
    name: atharva-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: atharva-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        value: sqlite:////data/atharva.db
      - key: CORS_ORIGINS
        value: https://atharvasharma.co.in,https://www.atharvasharma.co.in,http://localhost:4321,http://localhost:3000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: GITHUB_REPO
        value: RJ-Rishi91/Atharva-website
      - key: GITHUB_TOKEN
        sync: false
