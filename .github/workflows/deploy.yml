name: Deploy Atharva Website to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  repository_dispatch:
    types: [cms_post_published, scheduled_post_published, bulk_import_published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Static Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pre-warm Render Backend
        run: |
          echo "Pinging backend to ensure awake before Astro build..."
          curl -s --retry 5 --retry-delay 3 --max-time 15 https://atharva-api.onrender.com/api/health > /dev/null || true

      - name: Build with Astro
        env:
          ASTRO_TELEMETRY_DISABLED: 1
          PUBLIC_API_URL: https://atharva-api.onrender.com
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
